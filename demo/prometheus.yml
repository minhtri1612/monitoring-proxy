global:
  scrape_interval: 5s

scrape_configs:
  - job_name: node-production
    static_configs:
      - targets: [node-exporter-production:9100]
        labels:
          cluster: production
          environment: production

  - job_name: node-staging
    static_configs:
      - targets: [node-exporter-staging:9100]
        labels:
          cluster: staging
          environment: staging

  - job_name: demo-api-production
    static_configs:
      - targets: [demo-api-production:8080]
        labels:
          cluster: production
          environment: production

  - job_name: demo-api-staging
    static_configs:
      - targets: [demo-api-staging:8080]
        labels:
          cluster: staging
          environment: staging
