# Address of the Prometheus server. Docker Compose uses the service name here.
PrometheusURL: "http://prometheus:9090"
PrometheusKey: "Basic demo-prometheus-auth"
Authorization: "Basic demo-proxy-auth"
Policies:
  - Name: DataV2
    APIKey: demo-datav2-key
    Labels:
      - Label: project
        Value: DataV2
  - Name: K8S-PRODUCTION
    APIKey: demo-production-key
    Labels:
      - Label: cluster
        Value: production
  - Name: K8S-STAGING
    APIKey: demo-staging-key
    Labels:
      - Label: cluster
        Value: staging
